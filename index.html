<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Pages Test</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --primary: #38bdf8;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 640px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.5);
      }

      h1 {
        margin-top: 0;
        color: var(--primary);
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        font-size: 1.05rem;
      }

      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.4rem 0.8rem;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.15);
        color: var(--primary);
        font-weight: bold;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">GitHub Pages</div>
      <h1>Hello from GitHub Pages</h1>
      <p>
        This page is being hosted from a GitHub repository as a static website.
        It is a simple test to confirm that HTML files can be published and served successfully.
      </p>
      <p>
        If this page loads in your browser, the GitHub Pages setup is working correctly.
      </p>
    </main>
  </body>
</html>
